[project]
name = "imc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "elasticdeform>=0.5.1",
    "google-cloud-storage>=3.4.1",
    "matplotlib>=3.10.6",
    "natsort>=8.4.0",
    "nibabel>=5.3.2",
    "numpy<2",
    "pandas>=2.3.3",
    "pydicom>=3.0.1",
    "python-gdcm>3.0.10",
    "scikit-image>=0.25.2",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
]
[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "IMC"
module-root = "./"
