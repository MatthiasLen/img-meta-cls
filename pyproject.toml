[project]
name = "imc"
version = "0.1.0"
description = "Research code for DICOM series classification with image-metadata fusion, sparse metadata encoding, and Duke Liver MRI baselines."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["medical-imaging", "dicom", "multimodal-learning", "pytorch", "mri"]
dependencies = [
    "elasticdeform>=0.5.1",
    "matplotlib>=3.10.6",
    "natsort>=8.4.0",
    "numpy>2.1.0",
    "pandas>=2.3.3",
    "pyarrow<21.0.0",
    "pydicom>=3.0.1",
    "pytest>=9.0.2",
    "python-gdcm>3.0.10",
    "scikit-image>=0.25.2",
    "scikit-learn<1.7",
    "seaborn>=0.13.2",
    "simpleitk>=2.5.3",
    "tabulate>=0.9.0",
    "tensorboard>=2.20.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "xgboost>=3.1.3",
]

[project.urls]
Repository = "https://github.com/MatthiasLen/img-meta-cls"
Paper = "https://arxiv.org/abs/2602.23833"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "IMC"
module-root = "./"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
# F = Pyflakes (undefined names, unused imports)
# E = pycodestyle errors
# W = pycodestyle warnings
select = ["F", "E", "W"]
ignore = [
    "E501",  # line too long – handled by formatter
    "E741",  # ambiguous variable name (common in ML: l, I, O)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
